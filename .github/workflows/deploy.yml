name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Pages steps are gated to pushes, so a PR run is a plain build check and does
# not require Pages to be configured.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Fail if brand/tokens.json was edited without regenerating tokens.css/js.
    - name: Check generated tokens are current
      run: npm run tokens:check

    - name: Build
      run: npm run build
      env:
        NODE_ENV: production

    - name: Setup Pages
      if: github.event_name == 'push'
      uses: actions/configure-pages@v5

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: './build'

  deploy:
    needs: build
    # Only deploy from main; a PR run just builds as a check.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
